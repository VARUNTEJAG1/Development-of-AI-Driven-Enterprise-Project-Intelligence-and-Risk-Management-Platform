services:
  - type: web
    name: ai-project-backend
    env: python
    buildCommand: "cd AI_project/final_project/backend && pip install -r requirements.txt"
    startCommand: "cd AI_project/final_project/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:///./project_risk.db # Note: SQLite will reset on Render restarts. Replace with a Postgres URL later.
